spring.application.name=salone-auto-test

spring.datasource.url=jdbc:h2:mem:saloneauto;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JavaMailSender è sostituito da un mock nei test
spring.mail.host=localhost
app.mail.from=noreply@test.it

jwt.secret=segreto-di-test-lungo-almeno-trentadue-caratteri-0123456789
jwt.expiration-ms=3600000

app.frontend-url=http://localhost:5173
app.upload-dir=target/test-uploads
spring.servlet.multipart.max-file-size=5MB

app.admin.email=admin@test.it
app.admin.password=AdminPass123!

logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# Il client verso Auto.dev è sostituito da un mock nei test d'integrazione
app.autodev.base-url=http://autodev.invalid
app.autodev.api-key=chiave-di-test

# Tutti i test registrano utenti dallo stesso IP (127.0.0.1)
app.limiti.registrazioni-per-ora=100000
