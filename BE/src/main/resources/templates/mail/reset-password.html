<!DOCTYPE html>
<!--/* Solo th:text e th:href (fanno l'escape). Mai th:utext: il nome è testo, non HTML. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Reimposta la password</title>
</head>
<body style="font-family: sans-serif; color: #222;">
<p>Ciao <span th:text="${nome}">Mario</span>,</p>
<p>abbiamo ricevuto una richiesta di reimpostazione della password.</p>
<p><a th:href="${linkReset}" href="#">Reimposta la password</a></p>
<p style="font-size: 12px; color: #666;">
    Il link vale <span th:text="${minutiValidita}">30</span> minuti e può essere usato una sola volta.
    Se non sei stato tu, ignora questa mail.
</p>
</body>
</html>
