spring.application.name=salone-auto

# Carica le variabili dal file .env nella root del progetto (se presente).
# Le variabili d'ambiente di sistema hanno comunque la precedenza.
spring.config.import=optional:file:.env[.properties]

# ===== Database (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:salone_auto}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Email (SMTP) =====
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Mittente: se vuoto si usa spring.mail.username (vedi MailService)
app.mail.from=${MAIL_FROM:}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Frontend (CORS e link nelle mail) =====
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===== Upload immagini =====
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# ===== Auto.dev (decodifica VIN) =====
app.autodev.base-url=https://api.auto.dev
app.autodev.api-key=${AUTODEV_API_KEY:}

# ===== Amministratore iniziale (creato all'avvio se non esiste) =====
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ===== Log =====
# Hibernate stampa i messaggi d'errore del DB, che possono contenere i valori
# (es. "Key (email)=(...) already exists"): nei log non devono finire email.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
